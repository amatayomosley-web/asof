name: Publish to PyPI

# Trusted publishing (PyPI OIDC) — no API token stored anywhere.
# Fires when a GitHub Release is published. One-time setup required on PyPI:
#   PyPI -> project "asoftime" -> Publishing -> Add a trusted publisher:
#     Owner:        amatayomosley-web
#     Repository:   asof
#     Workflow:     publish.yml
#     Environment:  pypi
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/asoftime
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
